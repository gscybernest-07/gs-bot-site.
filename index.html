<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GS CYBER NEST - WhatsApp Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10241f;--mut:#5d716b;--line:#d5e0dc;--acc:#0f7b5f;--accd:#0a5c47;--amb:#c98512;--red:#b3342b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 40px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.wrap.wide{max-width:900px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.brand{font:800 20px "Bricolage Grotesque",system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=tel],textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer;min-height:44px}
button:hover{background:var(--accd)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.red{background:var(--red)}
button.full{width:100%;margin-top:12px}
button:disabled{opacity:.6}
a.btn{display:block;text-align:center;text-decoration:none;font-weight:600;background:#1f9d55;color:#fff;border-radius:10px;padding:12px;margin-top:12px}
:focus-visible{outline:3px solid #7cc6b0;outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;background:transparent;color:var(--mut);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.ok{background:#d9f1e8;color:var(--accd)}.wait{background:#fbecc8;color:#7a5200}.off{background:#f0dcda;color:var(--red)}
.code{background:var(--ink);color:#f1e7cf;font:800 34px/1 "Bricolage Grotesque",ui-monospace,monospace;letter-spacing:.12em;text-align:center;padding:20px 8px;border-radius:12px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{padding:10px 0;border-top:1px solid var(--line)}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.pk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;cursor:pointer}
.pk input{accent-color:var(--acc);width:20px;height:20px}
.pk b{margin-left:auto}
.box{background:#f4f8f6;border:1px dashed var(--acc);border-radius:10px;padding:12px;margin-top:12px}
.box big{font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:.04em}
.mut{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font:800 24px "Bricolage Grotesque",sans-serif}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts button{padding:8px 12px;min-height:38px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;max-width:90%;display:none;z-index:9}
#toast.bad{background:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status"></div>
<script>
const API = 'https://gs-bot-backend.onrender.com';
const ADMIN_WA = '255747013897', LIPA = '357194089', LIPA_NAME = 'GS CYBER NEST';
let token = null, me = null, pkgs = [], poll = null;
try { token = localStorage.getItem('t'); } catch (e) {}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString('en-US');
const norm = (v) => { let d = String(v || '').replace(/\D/g, ''); if (/^0\d{9}$/.test(d)) d = '255' + d.slice(1); else if (/^[67]\d{8}$/.test(d)) d = '255' + d; return d; };
fetch(API + '/health').catch(() => {});

async function api(p, body, method) {
  let r;
  try {
    r = await fetch(API + p, {
      method: method || (body !== undefined ? 'POST' : 'GET'),
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw new Error('Seva inaamka au mtandao una shida. Subiri sekunde 30 kisha ujaribu tena.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Hitilafu, jaribu tena');
  return j;
}
function toast(m, bad) {
  const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 3500);
}
async function run(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}
function logout() {
  clearInterval(poll); token = null;
  try { localStorage.removeItem('t'); } catch (e) {}
  authView();
}

/* ---------- Kuingia ---------- */
function authView(mode = 'login') {
  $('#app').className = 'wrap';
  $('#app').innerHTML = `
  <div class="top"><div class="brand">GS CYBER NEST</div></div>
  <h1 style="font-size:30px;margin:8px 0 6px">WhatsApp bot yako, inajibu masaa 24</h1>
  <p class="mut" style="margin:0 0 16px">Inajibu wateja kwa AI, inalike status na inalinda group lako dhidi ya links.</p>
  <div class="card">
    <div class="tabs"><button class="${mode === 'login' ? 'on' : ''}" id="tl">Ingia</button><button class="${mode === 'reg' ? 'on' : ''}" id="tr">Jisajili</button></div>
    <label for="ph">Namba ya simu (mfano 0712345678 au 255712345678)</label>
    <input id="ph" type="tel" inputmode="numeric" placeholder="255712345678">
    <label for="pw">Nenosiri</label>
    <input id="pw" type="password" placeholder="Angalau herufi 6">
    <button class="full" id="go">${mode === 'login' ? 'Ingia' : 'Fungua akaunti'}</button>
    ${mode === 'login' ? '<p style="text-align:center;margin:14px 0 0"><a href="#" id="fg">Umesahau nenosiri?</a></p>' : ''}
  </div>`;
  $('#tl').onclick = () => authView('login');
  $('#tr').onclick = () => authView('reg');
  if ($('#fg')) $('#fg').onclick = (e) => { e.preventDefault(); forgotView(); };
  $('#go').onclick = (e) => run(e.target, async () => {
    const r = await api(mode === 'login' ? '/api/login' : '/api/register', { phone: norm($('#ph').value), password: $('#pw').value.trim() });
    token = r.token;
    try { localStorage.setItem('t', token); } catch (x) {}
    await load();
  });
}

function forgotView(step = 1, ph = '') {
  $('#app').innerHTML = `<div class="top"><div class="brand">GS CYBER NEST</div></div>
  <div class="card"><h2>Rekebisha nenosiri</h2>
  <p class="mut">Unaweza kurekebisha nenosiri mara 2 tu. Code itatumwa kwenye WhatsApp ya namba yako.</p>
  <label for="ph">Namba ya simu</label><input id="ph" type="tel" inputmode="numeric" value="${esc(ph)}" placeholder="0712345678">
  ${step === 2 ? `<label for="cd">Code uliyotumiwa</label><input id="cd" type="tel" inputmode="numeric" maxlength="6">
  <label for="np">Nenosiri jipya</label><input id="np" type="password" placeholder="Angalau herufi 6">` : ''}
  <button class="full" id="go">${step === 1 ? 'Tuma code' : 'Hifadhi nenosiri'}</button>
  <button class="ghost full" id="bk">Rudi</button></div>`;
  $('#bk').onclick = () => authView();
  $('#go').onclick = (e) => run(e.target, async () => {
    const phone = norm($('#ph').value);
    if (step === 1) { await api('/api/forgot', { phone }); toast('Kama namba ipo, code imetumwa kwenye WhatsApp'); forgotView(2, phone); }
    else { const r = await api('/api/reset', { phone, code: $('#cd').value, password: $('#np').value }); toast(r.left > 0 ? 'Nenosiri limebadilishwa. Una nafasi 1 zaidi.' : 'Nenosiri limebadilishwa. Hii ilikuwa nafasi ya mwisho.'); authView(); }
  });
}

/* ---------- Dashibodi ya mtumiaji ---------- */
async function load() {
  try {
    [me, pkgs] = await Promise.all([api('/api/me'), api('/api/packages')]);
  } catch (e) { return logout(); }
  dash();
}
const daysLeft = (d) => Math.max(0, Math.ceil((new Date(d) - Date.now()) / 864e5));

function dash(code) {
  clearInterval(poll);
  const b = me.bot, linked = b.status === 'linked';
  $('#app').className = 'wrap';
  $('#app').innerHTML = `
  <div class="top"><div class="brand">GS CYBER NEST</div><div>${me.user.is_admin ? '<button class="ghost" id="adm">Admin</button> ' : ''}<button class="ghost" id="out">Toka</button></div></div>

  <div class="card">
    <div class="row"><h2>Hali ya bot</h2>${b.active ? '<span class="pill ok">Imewaka</span>' : '<span class="pill off">Haijalipiwa</span>'}</div>
    <p class="mut" style="margin:0">${b.active ? `Siku ${daysLeft(b.expires_at)} zimebaki.` : 'Chagua kifurushi hapa chini ili bot ianze kufanya kazi.'}</p>
  </div>

  <div class="card">
    <div class="row"><h2>WhatsApp yako</h2>${linked ? '<span class="pill ok">Imeunganishwa</span>' : b.status === 'pending_pairing' ? '<span class="pill wait">Inasubiri</span>' : '<span class="pill off">Haijaunganishwa</span>'}</div>
    ${linked ? `<p>Namba: <b>+${esc(b.wa_number)}</b></p><button class="ghost" id="dc">Ondoa muunganisho</button>` : `
    <label for="wn">Namba ya WhatsApp utakayounganisha</label>
    <input id="wn" type="tel" inputmode="numeric" placeholder="255712345678" value="${esc(me.user.phone)}">
    <button class="full" id="pr">Pata code</button>
    ${code ? `<div class="code" aria-live="polite">${esc(code)}</div>
    <p class="mut">Fungua WhatsApp, kisha Mipangilio, Vifaa vilivyounganishwa, Unganisha kifaa, kisha chagua <b>Unganisha kwa namba ya simu</b> na uweke code hii ndani ya dakika 3.</p>` : ''}`}
  </div>

  <div class="card">
    <h2>Mipangilio ya bot</h2>
    ${[['auto_reply', 'Jibu ujumbe kwa AI'], ['like_status', 'Like status za watu'], ['always_online', 'Onekana online masaa yote'], ['always_typing', 'Onyesha unaandika kwa muda mrefu'], ['anti_link', 'Futa links kwenye group']]
      .map(([k, t]) => `<div class="sw row"><label for="s_${k}" style="margin:0;color:var(--ink)">${t}</label><input type="checkbox" id="s_${k}" ${b[k] ? 'checked' : ''}></div>`).join('')}
    <label for="ai">Maelekezo ya AI (jina la biashara, bei, lugha, tabia)</label>
    <textarea id="ai" maxlength="1000" placeholder="Mfano: Wewe ni msaidizi wa duka la simu la Neema, Arusha. Jibu kwa Kiswahili kifupi.">${esc(b.ai_prompt)}</textarea>
    <button class="full" id="sv">Hifadhi mipangilio</button>
    <p class="mut">Ili bot ifute links, ifanye admin kwenye group husika.</p>
  </div>

  <div class="card">
    <h2>Huduma za ziada</h2>
    <p class="mut" style="margin:0 0 6px">Washa unazotaka tu. Amri zinaanza na nukta, mfano <b>.menu</b></p>
    ${[['view_status', 'Tazama status tu (bila like)'], ['anti_delete', 'Nitumie jumbe zilizofutwa kwenye chat yangu'], ['calc', 'Kokotoa (.hesabu 25*4)'], ['currency', 'Badili sarafu (.badili 100 usd tzs)'], ['qr', 'Tengeneza QR code (.qr maandishi)'], ['search', 'Tafuta mtandaoni (.tafuta swali)'], ['receipt', 'Toa risiti, kwa ajili yako tu (.risiti Mteja | Bidhaa 15000)']]
      .map(([k, t]) => `<div class="sw row"><label for="f_${k}" style="margin:0;color:var(--ink)">${t}</label><input type="checkbox" id="f_${k}" ${(b.features || {})[k] ? 'checked' : ''}></div>`).join('')}
    <label for="lg">Lugha ya majibu</label>
    <select id="lg">${[['auto', 'Kiotomatiki (lugha ya mteja)'], ['Kiswahili', 'Kiswahili'], ['English', 'English'], ['Francais', 'Fran\u00e7ais'], ['Arabic', '\u0627\u0644\u0639\u0631\u0628\u064a\u0629'], ['Espanol', 'Espa\u00f1ol'], ['Portugues', 'Portugu\u00eas']].map(([v, t]) => `<option value="${v}" ${((b.features || {}).lang || 'auto') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label for="bz">Jina la biashara (linaonekana kwenye risiti)</label>
    <input id="bz" type="text" maxlength="60" value="${esc((b.features || {}).business)}">
    <label for="em">Emoji za kulike status (acha nafasi kati ya kila moja)</label>
    <input id="em" type="text" maxlength="20" value="${esc((b.features || {}).status_emoji || '\u2764\ufe0f')}">
    <p class="mut">Jumbe zilizofutwa zinatumwa kwenye chat yako mwenyewe tu.</p>
  </div>

  <div class="card" id="payc">
    <h2>Lipia kifurushi</h2>
    ${pkgs.map((p, i) => `<label class="pk"><input type="radio" name="pk" value="${p.id}" ${i === 0 ? 'checked' : ''}><span>${esc(p.name)}<br><span class="mut">Siku ${p.days}</span></span><b>TSh ${fmt(p.price_tsh)}</b></label>`).join('')}
    <div class="box"><span class="mut">M-PESA Lipa Namba</span><br><big>${LIPA}</big><br><span class="mut">Jina: ${LIPA_NAME}</span></div>
    <label for="tx">Transaction ID kutoka ujumbe wa M-PESA</label>
    <input id="tx" type="text" autocapitalize="characters" placeholder="Mfano QJK1X2Y3Z4">
    <button class="full" id="pay">Nimelipa, tuma ombi</button>
    <div id="wa"></div>
  </div>

  <div class="card"><h2>Historia ya malipo</h2><div class="list" id="hist"><span class="mut">Inapakia...</span></div></div>`;

  $('#out').onclick = logout;
  if ($('#adm')) $('#adm').onclick = adminView;
  if ($('#dc')) $('#dc').onclick = (e) => run(e.target, async () => { await api('/api/bot/disconnect', {}); await load(); toast('Imeondolewa'); });
  if ($('#pr')) $('#pr').onclick = (e) => run(e.target, async () => {
    const r = await api('/api/bot/pair', { phone: norm($('#wn').value) });
    me.bot.status = 'pending_pairing';
    dash(r.code);
    poll = setInterval(async () => {
      try { const m = await api('/api/me'); if (m.bot.status === 'linked') { me = m; dash(); toast('WhatsApp imeunganishwa'); } } catch (x) {}
    }, 4000);
  });
  $('#sv').onclick = (e) => run(e.target, async () => {
    const body = { ai_prompt: $('#ai').value };
    ['auto_reply', 'like_status', 'always_online', 'always_typing', 'anti_link'].forEach((k) => (body[k] = $('#s_' + k).checked));
    body.features = { lang: $('#lg').value, business: $('#bz').value, status_emoji: $('#em').value };
    ['view_status', 'anti_delete', 'calc', 'currency', 'qr', 'search', 'receipt'].forEach((k) => (body.features[k] = $('#f_' + k).checked));
    await api('/api/bot/settings', body);
    Object.assign(me.bot, body);
    toast('Imehifadhiwa');
  });
  $('#pay').onclick = (e) => run(e.target, async () => {
    const id = Number(document.querySelector('input[name=pk]:checked').value);
    const p = pkgs.find((x) => x.id === id), tx = $('#tx').value.trim().toUpperCase();
    await api('/api/payments', { package_id: id, transaction_id: tx });
    const msg = `Habari, nimelipa TSh ${fmt(p.price_tsh)} kwa ${LIPA_NAME} (kifurushi: ${p.name}). Namba yangu: +${me.user.phone}. Transaction ID: ${tx}. Nitatuma screenshot ya muamala.`;
    $('#wa').innerHTML = `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}">Tuma screenshot kwa admin (WhatsApp)</a><p class="mut">Ombi lako linasubiri uthibitisho. Bot itawaka admin akithibitisha.</p>`;
    histLoad();
  });
  histLoad();
}
async function histLoad() {
  try {
    const h = await api('/api/payments');
    $('#hist').innerHTML = h.length ? h.map((p) => `<div class="row"><span>${esc(p.packages?.name)} - TSh ${fmt(p.amount_tsh)}<br><span class="mut">${esc(p.transaction_id)}</span></span><span class="pill ${p.status === 'approved' ? 'ok' : p.status === 'pending' ? 'wait' : 'off'}">${p.status === 'approved' ? 'Imethibitishwa' : p.status === 'pending' ? 'Inasubiri' : 'Imekataliwa'}</span></div>`).join('') : '<span class="mut">Bado hakuna malipo.</span>';
  } catch (e) {}
}

/* ---------- Admin ---------- */
async function adminView(tab = 'pending') {
  clearInterval(poll);
  $('#app').className = 'wrap wide';
  $('#app').innerHTML = `<div class="top"><div class="brand">Admin</div><button class="ghost" id="bk">Rudi kwenye akaunti</button></div>
  <div class="stats" id="st"></div>
  <div class="card"><div class="tabs">${[['pending', 'Zinasubiri'], ['approved', 'Zilizothibitishwa'], ['rejected', 'Zilizokataliwa']].map(([t, n]) => `<button data-t="${t}" class="${tab === t ? 'on' : ''}">${n}</button>`).join('')}</div><div class="list" id="pp">Inapakia...</div></div>
  <div class="card"><h2>Watumiaji</h2><input id="q" type="text" placeholder="Tafuta kwa namba..." inputmode="numeric"><div class="list" id="us">Inapakia...</div></div>`;
  $('#bk').onclick = load;
  let users = [];
  const dl = (d) => Math.ceil((new Date(d) - Date.now()) / 864e5);
  const drawUsers = () => {
    const q = $('#q').value.replace(/\D/g, '');
    $('#us').innerHTML = users.filter((u) => u.phone.includes(q)).map((u) => { const b = (Array.isArray(u.bots) ? u.bots[0] : u.bots) || {}; const d = b.expires_at ? dl(b.expires_at) : 0; return `<div><b>+${esc(u.phone)}</b> ${u.banned ? '<span class="pill off">Amezuiwa</span>' : ''}${u.is_admin ? ' <span class="pill wait">Admin</span>' : ''}<br>
      <span class="mut">${esc(b.status || '-')}${b.wa_number ? ' (+' + esc(b.wa_number) + ')' : ''} | ${d > 0 ? 'siku ' + d : 'haijalipiwa'} | kurekebisha nenosiri: ${u.reset_count || 0}/2</span>
      <div class="acts"><button class="ghost" data-a="extend" data-id="${u.id}">Ongeza siku</button><button class="ghost" data-a="reset" data-id="${u.id}">Weka upya nenosiri</button><button class="ghost" data-a="ban" data-id="${u.id}" data-b="${u.banned ? 0 : 1}">${u.banned ? 'Ruhusu' : 'Zuia'}</button></div></div>`; }).join('') || '<span class="mut">Hakuna.</span>';
  };
  try {
    const [s, pay, us] = await Promise.all([api('/api/admin/stats'), api('/api/admin/payments?status=' + tab), api('/api/admin/users')]);
    users = us;
    $('#st').innerHTML = [['Watumiaji', s.users], ['Zimeunganishwa sasa', s.live], ['Zimelipiwa', s.active], ['Mapato mwezi (TSh)', fmt(s.revenue_month)]].map(([t, n]) => `<div><b>${n}</b><span class="mut">${t}</span></div>`).join('');
    $('#pp').innerHTML = pay.length ? pay.map((p) => `<div><b>+${esc(p.users?.phone)}</b> - ${esc(p.packages?.name)} (siku ${p.packages?.days}), TSh ${fmt(p.amount_tsh)}<br><span class="mut">ID: ${esc(p.transaction_id)} | ${new Date(p.created_at).toLocaleString()}</span>
      ${tab === 'pending' ? `<div class="acts"><button data-a="approve" data-id="${p.id}">Thibitisha</button><button class="red" data-a="reject" data-id="${p.id}">Kataa</button></div>` : ''}</div>`).join('') : '<span class="mut">Hakuna.</span>';
    drawUsers();
    $('#q').oninput = drawUsers;
  } catch (e) { toast(e.message, true); }
  $('#app').onclick = (e) => {
    const t = e.target.closest('button[data-t]');
    if (t) return adminView(t.dataset.t);
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const { a, id } = b.dataset;
    run(b, async () => {
      if (a === 'approve') await api(`/api/admin/payments/${id}/approve`, {});
      if (a === 'reject') { if (!confirm('Kataa malipo haya?')) return; await api(`/api/admin/payments/${id}/reject`, {}); }
      if (a === 'extend') { const d = prompt('Siku ngapi za kuongeza?', '7'); if (!d) return; await api(`/api/admin/users/${id}/extend`, { days: Number(d) }); }
      if (a === 'ban') await api(`/api/admin/users/${id}/ban`, { banned: b.dataset.b === '1' });
      if (a === 'reset') { if (!confirm('Weka nenosiri jipya la muda kwa mtumiaji huyu?')) return; const r = await api(`/api/admin/users/${id}/reset`, {}); alert('Nenosiri jipya la muda: ' + r.password + '\nMpe mtumiaji, kisha abadilishe.'); }
      toast('Imekamilika'); adminView(tab);
    });
  };
}

token ? load() : authView(location.hash === '#jisajili' ? 'reg' : 'login');
</script>
</body>
</html>
